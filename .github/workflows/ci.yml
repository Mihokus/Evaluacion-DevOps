name: Catalogo

on:
  push:
    branches:[ develop ]
  pull_request:
    branches: [main]

jobs:
  build:
    runs_on: ubuntu_latest
    spetps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      -name: validar proyecto
        run: |
          chmod +x mvnw
          ./mvnw test
